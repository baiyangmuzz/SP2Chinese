<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 文字渐变 -->
    <linearGradient id="whiteText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#f2f6fb"/>
      <stop offset="100%" stop-color="#d9e4f0"/>
    </linearGradient>

    <linearGradient id="blueText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7cc4ff"/>
      <stop offset="45%"  stop-color="#2f9bf0"/>
      <stop offset="100%" stop-color="#1266c4"/>
    </linearGradient>

    <!-- 背景：深海军蓝径向 -->
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%"   stop-color="#1c3355"/>
      <stop offset="45%"  stop-color="#132340"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </radialGradient>

    <!-- 底部红蓝斜带 -->
    <linearGradient id="bandBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4aa8f5"/>
      <stop offset="60%"  stop-color="#1e8ce8"/>
      <stop offset="100%" stop-color="#1466b4"/>
    </linearGradient>
    <linearGradient id="bandRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff5a5a"/>
      <stop offset="60%"  stop-color="#e23e3e"/>
      <stop offset="100%" stop-color="#a82626"/>
    </linearGradient>

    <!-- 圆角裁剪 -->
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- 背景 -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- 红蓝斜带（在文字下方，露出下缘） -->
    <g transform="translate(0,352) skewY(-4)">
      <rect x="-16" y="0"   width="544" height="34" fill="url(#bandBlue)"/>
      <rect x="-16" y="34"  width="544" height="26" fill="url(#bandRed)"/>
    </g>

    <!-- 主标题：SP 白 / 2 蓝 -->
    <text x="256" y="300" text-anchor="middle"
          font-family="Arial Black, 'Arial Bold', Impact, sans-serif"
          font-size="160" font-weight="900" letter-spacing="-6">
      <tspan fill="url(#whiteText)">SP</tspan>
      <tspan fill="url(#blueText)" dx="16">2</tspan>
    </text>
  </g>
</svg>
