<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP2 - 汉化版图标</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080a0e;
        background-image: radial-gradient(circle at 50% 40%, #12151b 0%, #080a0e 68%);
    }

    .app-icon {
        width: min(90vw, 450px);
        aspect-ratio: 1;
        border-radius: 22.5%;
        overflow: hidden;
        position: relative;
        background:
            radial-gradient(ellipse at 35% 22%, #303946 0%, #1b222c 42%, #10141b 100%);
        box-shadow:
            0 36px 80px -10px rgba(0, 0, 0, .78),
            0 10px 22px rgba(0, 0, 0, .55),
            inset 0 1px 1px rgba(255, 255, 255, .16),
            inset 0 -2px 5px rgba(0, 0, 0, .5);
        animation: icon-appear .75s cubic-bezier(.2, .8, .2, 1) both;
    }

    .app-icon::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, .10);
        pointer-events: none;
        z-index: 2;
    }

    .app-icon::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(158deg,
            rgba(255, 255, 255, .09) 0%,
            rgba(255, 255, 255, .025) 32%,
            rgba(255, 255, 255, 0) 54%);
        pointer-events: none;
        z-index: 3;
    }

    svg { width: 100%; height: 100%; display: block; }

    @keyframes icon-appear {
        from { opacity: 0; transform: scale(.94); }
        to   { opacity: 1; transform: scale(1); }
    }
</style>
</head>
<body>

<div class="app-icon">
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="SP2 汉化版图标">

    <defs>
        <!-- 主文字渐变 -->
        <linearGradient id="whiteText" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#e4e9f0"/>
            <stop offset="100%" stop-color="#aeb8c5"/>
        </linearGradient>

        <!-- 数字 2：航空蓝 -->
        <linearGradient id="blueText" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#75e3ff"/>
            <stop offset="45%" stop-color="#16b9f2"/>
            <stop offset="100%" stop-color="#0873c8"/>
        </linearGradient>

        <!-- 红色印章 -->
        <linearGradient id="redStamp" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff6259"/>
            <stop offset="100%" stop-color="#c91f27"/>
        </linearGradient>

        <!-- 主标题投影 -->
        <filter id="titleShadow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="7" stdDeviation="7"
                          flood-color="#000000" flood-opacity="0.55"/>
        </filter>

        <!-- 蓝色辉光 -->
        <filter id="blueGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="12"/>
        </filter>

        <!-- 印章柔和阴影 -->
        <filter id="stampShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6"/>
        </filter>

        <!-- 印章粗糙边缘 -->
        <filter id="stampRough" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.55"
                          numOctaves="3" seed="7" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"
                               xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <!-- 颗粒噪点 -->
        <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85"
                          numOctaves="3" seed="21" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0"/>
        </filter>

        <!-- 暗角 -->
        <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
            <stop offset="55%" stop-color="#000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
        </radialGradient>
    </defs>

    <!-- 背景装饰圆 -->
    <g opacity=".13" fill="none" stroke="#9eb2c8" stroke-width="1">
        <circle cx="256" cy="256" r="205"/>
        <circle cx="256" cy="256" r="218" stroke-dasharray="3 12"/>
        <path d="M256 35 V75 M256 437 V477"/>
        <path d="M35 256 H75 M437 256 H477"/>
    </g>

    <!-- 角落细节线（左右对称） -->
    <g stroke="#8ca0b5" opacity=".22" stroke-width="2">
        <path d="M76 105 H145"/>
        <path d="M76 113 H112"/>
        <path d="M368 105 H436"/>
        <path d="M400 113 H436"/>
    </g>

    <!-- 数字 2 辉光 -->
    <text x="374" y="300"
          text-anchor="middle"
          font-family="Arial Black, 'Arial Bold', Impact, sans-serif"
          font-size="160" font-weight="900"
          fill="#00bfff" opacity=".22"
          filter="url(#blueGlow)">2</text>

    <!-- 主标题 SP2（整体居中，tspan 分色） -->
    <text x="256" y="300"
          text-anchor="middle"
          font-family="Arial Black, 'Arial Bold', Impact, sans-serif"
          font-size="160" font-weight="900"
          letter-spacing="-6"
          filter="url(#titleShadow)">
        <tspan fill="url(#whiteText)">SP</tspan>
        <tspan fill="url(#blueText)" dx="16">2</tspan>
    </text>

    <!-- 下方航空识别线 -->
    <g>
        <rect x="90" y="340" width="332" height="3" rx="1.5"
              fill="#91a6ba" opacity=".32"/>
        <rect x="90" y="340" width="92" height="3" rx="1.5"
              fill="#23bff5"/>
        <circle cx="422" cy="341.5" r="3" fill="#23bff5"/>
    </g>

    <!-- 汉化印章 -->
    <g transform="rotate(-10 390 410)" filter="url(#stampRough)">

        <!-- 印章阴影 -->
        <rect x="300" y="372" width="180" height="76" rx="6"
              fill="#000" opacity=".40"
              transform="translate(4 7)"
              filter="url(#stampShadow)"/>

        <!-- 外框 -->
        <rect x="300" y="372" width="180" height="76" rx="6"
              fill="#101319" fill-opacity=".90"
              stroke="url(#redStamp)" stroke-width="4.5"/>

        <!-- 内框 -->
        <rect x="309" y="381" width="162" height="58" rx="2"
              fill="none" stroke="#ff554e" stroke-width="1.4"
              opacity=".62"/>

        <!-- 印章文字 -->
        <text x="390" y="422"
              text-anchor="middle"
              font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
              font-size="36" font-weight="900"
              letter-spacing="8"
              fill="#ff514b">汉化</text>
    </g>

    <!-- 底部版本标识 -->
    <text x="256" y="490"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="12" font-weight="700"
          letter-spacing="4"
          fill="#8d9aaa" opacity=".62">
        CHINESE LOCALIZATION
    </text>

    <!-- 颗粒噪点 -->
    <rect width="512" height="512"
          filter="url(#grain)"
          opacity=".045"
          pointer-events="none"/>

    <!-- 暗角 -->
    <rect width="512" height="512"
          fill="url(#vignette)"
          pointer-events="none"/>

</svg>
</div>

</body>
</html>
